<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --ocean-deep:#020b18; --ocean-mid:#041428; --ocean-surface:#062040;
  --cyan:#00d4ff; --gold:#f0a500; --white:#e8f4ff; --muted:rgba(232,244,255,0.5);
}
html { scroll-behavior:smooth; }
body { background:var(--ocean-deep); color:var(--white); font-family:'DM Sans',sans-serif; overflow-x:hidden; }

/* Nav */
nav {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  padding:1.2rem 4rem; display:flex; align-items:center; justify-content:space-between;
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); background:rgba(2,11,24,0.9);
  border-bottom:1px solid rgba(0,212,255,0.1);
}
.nav-logo { display:flex; align-items:center; gap:12px; text-decoration:none; }
.nav-logo img { width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid rgba(0,212,255,0.4); box-shadow:0 0 12px rgba(0,212,255,0.3); }
.nav-logo span { font-family:'Playfair Display',serif; font-size:1.4rem; font-style:italic; color:var(--cyan); text-shadow:0 0 20px rgba(0,212,255,0.5); }
.nav-links { display:flex; gap:2rem; list-style:none; }
.nav-links a { color:var(--muted); text-decoration:none; font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase; transition:color 0.3s; }
.nav-links a:hover { color:var(--cyan); }
.nav-auth { display:flex; gap:1rem; align-items:center; }
.nav-auth a { color:var(--muted); text-decoration:none; font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase; transition:color 0.3s; }
.nav-auth a:hover { color:var(--cyan); }
.nav-cta-btn { padding:0.5rem 1.2rem; border:1px solid var(--cyan); border-radius:50px; color:var(--cyan) !important; }
.nav-cta-btn:hover { background:var(--cyan); color:var(--ocean-deep) !important; }
.nav-btn-login { padding:0.45rem 1.2rem; border:1px solid rgba(0,212,255,0.45); border-radius:50px; color:var(--cyan); font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; background:transparent; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.3s; text-decoration:none; }
.nav-btn-login:hover { background:rgba(0,212,255,0.1); }
.nav-user { position:relative; display:flex; align-items:center; gap:0.6rem; cursor:pointer; }
.nav-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--cyan),#0066aa); display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:700; color:var(--ocean-deep); border:2px solid rgba(0,212,255,0.4); font-family:'Playfair Display',serif; flex-shrink:0; }
.nav-username { font-size:0.8rem; color:var(--white); max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-dropdown { position:absolute; top:calc(100% + 10px); right:0; min-width:170px; background:rgba(4,20,40,0.97); border:1px solid rgba(0,212,255,0.18); border-radius:14px; padding:0.5rem; -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); box-shadow:0 20px 60px rgba(0,0,0,0.5); z-index:2000; display:none; }
.nav-user:hover .nav-dropdown, .nav-user.open .nav-dropdown { display:block; }
.nav-dropdown a, .nav-dropdown button { display:block; width:100%; text-align:left; padding:0.6rem 1rem; font-size:0.82rem; color:rgba(232,244,255,0.5); text-decoration:none; background:transparent; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; border-radius:8px; transition:all 0.2s; }
.nav-dropdown a:hover, .nav-dropdown button:hover { background:rgba(0,212,255,0.08); color:var(--cyan); }
.nav-dropdown hr { border:none; border-top:1px solid rgba(0,212,255,0.1); margin:0.4rem 0; }

/* Hero banner */
.island-hero {
  height:60vh; min-height:400px; position:relative; overflow:hidden;
  display:flex; align-items:flex-end;
}
.island-hero-img {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  transition:transform 0.6s;
}
.island-hero-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(2,11,24,0.2) 0%, rgba(2,11,24,0.7) 70%, rgba(2,11,24,1) 100%);
}
.island-hero-content { position:relative; z-index:2; padding:3rem 6rem; width:100%; }
.island-breadcrumb { font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--cyan); margin-bottom:0.8rem; }
.island-breadcrumb a { color:var(--cyan); text-decoration:none; }
.island-hero-title { font-family:'Playfair Display',serif; font-size:clamp(2.5rem,6vw,5rem); font-weight:900; line-height:1.1; }
.island-hero-meta { display:flex; gap:2rem; margin-top:1rem; flex-wrap:wrap; }
.meta-chip { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.75rem; letter-spacing:0.1em; color:var(--muted); }
.meta-chip span { color:var(--cyan); font-weight:600; }

/* Sidebar layout */
.island-body { max-width:1300px; margin:0 auto; padding:4rem 4rem 6rem; display:grid; grid-template-columns:1fr 340px; gap:4rem; align-items:start; }

/* Tabs */
.tab-nav { display:flex; gap:0; margin-bottom:2.5rem; border-bottom:1px solid rgba(0,212,255,0.12); }
.tab-btn { padding:0.75rem 1.5rem; background:none; border:none; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; position:relative; transition:color 0.3s; }
.tab-btn::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:var(--cyan); transform:scaleX(0); transition:transform 0.3s; }
.tab-btn.active { color:var(--cyan); }
.tab-btn.active::after { transform:scaleX(1); }
.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* Content typography */
h3 { font-family:'Playfair Display',serif; font-size:1.4rem; margin-bottom:1rem; color:var(--white); }
p { color:var(--muted); line-height:1.8; margin-bottom:1rem; font-size:0.95rem; }
ul.dive-list { list-style:none; display:flex; flex-direction:column; gap:0.6rem; margin-bottom:1.5rem; }
ul.dive-list li { display:flex; align-items:flex-start; gap:0.7rem; color:var(--muted); font-size:0.9rem; }
ul.dive-list li::before { content:'🤿'; flex-shrink:0; }

/* Dive sites grid */
.sites-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; margin-top:1rem; }
.site-card {
  background:rgba(0,212,255,0.04); border:1px solid rgba(0,212,255,0.1);
  border-radius:14px; padding:1.2rem; transition:all 0.3s;
}
.site-card:hover { border-color:rgba(0,212,255,0.3); background:rgba(0,212,255,0.08); transform:translateY(-3px); }
.site-name { font-weight:600; font-size:0.9rem; margin-bottom:0.3rem; color:var(--white); }
.site-depth { font-size:0.75rem; color:var(--cyan); margin-bottom:0.4rem; }
.site-desc { font-size:0.8rem; color:var(--muted); line-height:1.6; }

/* Best time pills */
.month-pills { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.5rem; }
.month-pill { padding:0.3rem 0.8rem; border-radius:20px; font-size:0.75rem; background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.15); color:var(--muted); }
.month-pill.best { background:rgba(0,212,255,0.15); border-color:var(--cyan); color:var(--cyan); }

/* Sidebar */
.sidebar-card {
  background:rgba(0,212,255,0.04); border:1px solid rgba(0,212,255,0.15);
  border-radius:20px; padding:2rem; position:sticky; top:100px;
}
.sidebar-card h4 { font-family:'Playfair Display',serif; font-size:1.1rem; margin-bottom:1.5rem; color:var(--white); }
.price-display { font-family:'Playfair Display',serif; font-size:2.2rem; color:var(--cyan); margin-bottom:0.3rem; }
.price-sub { font-size:0.75rem; color:var(--muted); margin-bottom:1.5rem; }
.sidebar-row { display:flex; justify-content:space-between; align-items:center; padding:0.6rem 0; border-bottom:1px solid rgba(0,212,255,0.06); font-size:0.85rem; }
.sidebar-row:last-of-type { border-bottom:none; }
.sidebar-row .label { color:var(--muted); }
.sidebar-row .value { color:var(--white); font-weight:500; }
.btn-book-island {
  width:100%; margin-top:1.5rem; padding:1rem;
  background:linear-gradient(135deg,var(--cyan),#0099cc);
  color:var(--ocean-deep); border:none; border-radius:50px;
  font-size:0.85rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase;
  cursor:pointer; transition:all 0.3s; font-family:'DM Sans',sans-serif; text-decoration:none;
  display:block; text-align:center;
}
.btn-book-island:hover { transform:translateY(-2px); box-shadow:0 15px 40px rgba(0,212,255,0.4); }

/* Gallery strip */
.gallery-strip { display:grid; grid-template-columns:repeat(3,1fr); gap:0.6rem; margin-top:1.5rem; }
.gallery-strip img { width:100%; height:90px; object-fit:cover; border-radius:10px; cursor:pointer; transition:transform 0.3s; }
.gallery-strip img:hover { transform:scale(1.04); }

/* All islands nav */
.islands-nav-section { padding:5rem 4rem; background:var(--ocean-mid); }
.islands-nav-section h3 { font-family:'Playfair Display',serif; font-size:1.6rem; margin-bottom:2rem; text-align:center; }
.islands-cards-grid { max-width:1300px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1.5rem; }
.island-nav-card {
  border-radius:16px; overflow:hidden; cursor:pointer;
  border:1px solid rgba(0,212,255,0.08); transition:all 0.3s;
  background:rgba(0,212,255,0.03); text-decoration:none;
}
.island-nav-card:hover { border-color:rgba(0,212,255,0.3); transform:translateY(-5px); box-shadow:0 20px 40px rgba(0,212,255,0.1); }
.island-nav-card img { width:100%; height:160px; object-fit:cover; display:block; }
.island-nav-card-body { padding:1rem 1.2rem; }
.island-nav-card-name { font-weight:600; font-size:0.95rem; margin-bottom:0.2rem; color:var(--white); }
.island-nav-card-depth { font-size:0.75rem; color:var(--cyan); }

/* Responsive */
@media(max-width:1024px){ .island-body{ grid-template-columns:1fr; } .sidebar-card{ position:static; } }
@media(max-width:768px){ nav{padding:1rem 1.5rem;} .nav-links{display:none;} .island-hero-content{padding:2rem 1.5rem;} .island-body{padding:2rem 1.5rem;} .islands-nav-section{padding:3rem 1.5rem;} }

.ripple-effect { position:fixed; border-radius:50%; border:2px solid rgba(0,212,255,0.5); transform:translate(-50%,-50%) scale(0); animation:rippleAnim 0.8s ease-out forwards; pointer-events:none; z-index:9997; }
.is-hidden { display:none; }
.cyan-italic { color:var(--cyan); font-style:italic; }
.simple-footer { padding:3rem 4rem 2rem; background:var(--ocean-deep); border-top:1px solid rgba(0,212,255,0.05); text-align:center; }
.footer-title { font-family:'Playfair Display',serif; font-size:1.5rem; font-style:italic; color:var(--cyan); margin-bottom:0.5rem; }
.footer-copy { color:var(--muted); font-size:0.8rem; }
</style>
</head>

function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}

function bookIsland(id, name) {
  // Pre-fill destination in booking form
  localStorage.setItem('deepdive_prefill_island', id);
  localStorage.setItem('deepdive_prefill_island_name', name);
  window.location.href = 'index.html#booking';
}

// Nav scroll
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 80);
});
document.addEventListener('click', e => {
  const r = document.createElement('div'); r.className = 'ripple-effect';
  r.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;width:60px;height:60px;`;
  document.body.appendChild(r); setTimeout(() => r.remove(), 800);
});

async function refreshAuthUI() {
  const user = await getUser();
  const navGuest   = document.getElementById('navGuest');
  const navUser    = document.getElementById('navUser');
  const navAvatar  = document.getElementById('navAvatar');
  const navUsername= document.getElementById('navUsername');
  if (user) {
    if (navGuest) navGuest.style.display = 'none';
    if (navUser)  navUser.style.display  = 'flex';
    const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || '?';
    if (navUsername) navUsername.textContent = name.split(' ')[0];
    if (navAvatar)   navAvatar.textContent   = name.charAt(0).toUpperCase();
  } else {
    if (navGuest) navGuest.style.display = '';
    if (navUser)  navUser.style.display  = 'none';
  }
}
_supabase.auth.onAuthStateChange(() => refreshAuthUI());
refreshAuthUI();
